<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI一発ギャグMaker 🎤 超高速完成版</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff8e1; margin: 0; padding: 20px; color: #2c3e50; -webkit-tap-highlight-color: transparent; }
    .card { background: white; padding: 24px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; border: 4px solid #ffccbc; }
    h1 { font-size: 24px; text-align: center; color: #e64a19; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; color: #8d6e63; display: block; margin-top: 15px; margin-bottom: 5px; }
    input, select { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 14px; border: 2px solid #ffccbc; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.2s; background: #fff; appearance: none; }
    button { width: 100%; padding: 18px; background: #ff7043; color: white; border: none; border-radius: 16px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #d84315; transition: 0.1s; margin-top: 10px; }
    button:active { transform: translateY(4px); box-shadow: none; }
    button:disabled { background: #bdbdbd; box-shadow: none; cursor: not-allowed; }
    .result-box { background: #fffde7; border: 3px dashed #ffab91; border-radius: 20px; padding: 25px; margin-top: 25px; display: none; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .lines-box { font-size: 26px; font-weight: bold; text-align: center; color: #bf360c; padding: 20px; background: #ffe0b2; border-radius: 14px; margin: 15px 0; line-height: 1.4; }
    .speaker-btn { background: #039be5; box-shadow: 0 5px 0 #01579b; font-size: 18px; }
    .setting-group { background: #fbe9e7; padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid #ffccbc; }
    .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: #e64a19; font-weight: bold; }
    input[type="range"] { width: 100%; margin: 8px 0 18px 0; cursor: pointer; }
    optgroup { font-style: normal; font-weight: bold; color: #e64a19; }
    .status-area { font-size: 10px; color: #bcaaa4; text-align: center; margin-top: 10px; min-height: 1.2em; }
    .test-btn { background: #eee; color: #666; font-size: 11px; padding: 6px 12px; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; width: auto; box-shadow: none; display: inline-block; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎤 AI一発ギャグMaker</h1>
    
    <label>Google APIキー</label>
    <input type="password" id="apiKey" placeholder="キーを貼り付け" />

    <label>シチュエーション（どこでやる？）</label>
    <select id="situation">
      <optgroup label="パーティー・飲み会">
        <option value="忘年会・新年会">忘年会・新年会</option>
        <option value="合コン・婚活パーティー">合コン・婚活パーティー</option>
        <option value="結婚式の余興">結婚式の余興</option>
        <option value="女子会・男子会">女子会・男子会</option>
      </optgroup>
      <optgroup label="ビジネス・学校">
        <option value="自己紹介の場" selected>自己紹介の場</option>
        <option value="プレゼンの冒頭（アイスブレイク）">プレゼンの冒頭</option>
        <option value="オフィス（静かな仕事中）">オフィス（仕事中）</option>
        <option value="学校の休み時間">学校の休み時間</option>
      </optgroup>
      <optgroup label="日常・ピンチ">
        <option value="気まずい沈黙の瞬間">気まずい沈黙の瞬間</option>
        <option value="怒られている最中">怒られている最中</option>
        <option value="デートの別れ際">デートの別れ際</option>
        <option value="コンビニのレジ前">コンビニのレジ前</option>
        <option value="歯医者さんの待合室">歯医者さんの待合室</option>
        <option value="家族団らん中">家族団らん中</option>
      </optgroup>
    </select>

    <label>お題・キーワード</label>
    <input type="text" id="keyword" placeholder="例: フジカワ、今日からおれは" />

    <button id="generateBtn" onclick="startGeneration()">ギャグを爆誕させる！</button>
    
    <div id="status" class="status-area"></div>

    <div id="resultBox" class="result-box">
      <div id="gagTitle" style="font-weight:bold; color:#e64a19; text-align:center; font-size:1.4em;"></div>
      <div id="gagAction" style="margin:15px 0; font-size:15px; background:white; padding:15px; border-radius:10px; border-left:5px solid #ff7043; color: #4e342e;"></div>
      <div id="gagLines" class="lines-box"></div>

      <div class="setting-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <label style="margin:0; color:#d84315;">🗣 声の選択</label>
            <button class="test-btn" onclick="testVoice()">🔊 声をテスト</button>
        </div>
        <select id="voiceSelect" onchange="testVoice()"></select>

        <div class="slider-label"><span>🐢 話すスピード</span><span id="speedVal">1.2</span></div>
        <input type="range" id="rateRange" min="0.5" max="2.0" step="0.1" value="1.2" oninput="document.getElementById('speedVal').textContent=this.value">

        <div class="slider-label"><span>📉 声の高さ</span><span id="pitchVal">1.0</span></div>
        <input type="range" id="pitchRange" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('pitchVal').textContent=this.value">
      </div>

      <button class="speaker-btn" onclick="speakGag()">🔊 ギャグを喋らせる</button>
    </div>
  </div>

  <script>
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    let currentGagText = '';
    let voices = [];

    function populateVoices() {
      window.speechSynthesis.cancel();
      voices = window.speechSynthesis.getVoices();
      const select = document.getElementById('voiceSelect');
      if(!select) return;
      const current = select.value;
      select.innerHTML = '';
      const jpVoices = voices.filter(v => v.lang.includes('ja'));
      if(jpVoices.length === 0) {
        select.innerHTML = '<option>標準ボイス</option>';
      } else {
        jpVoices.forEach(v => {
          const opt = document.createElement('option');
          opt.textContent = v.name.replace('Samantha','').replace('Compact','');
          opt.value = v.name;
          if(v.name === current) opt.selected = true;
          select.appendChild(opt);
        });
      }
    }
    window.speechSynthesis.onvoiceschanged = populateVoices;
    window.onload = populateVoices;
    window.addEventListener('touchstart', () => { if(voices.length < 2) populateVoices(); }, {once: true});

    function testVoice() {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("テスト再生です。");
      const vName = document.getElementById('voiceSelect').value;
      const v = voices.find(v => v.name === vName);
      if(v) u.voice = v;
      u.lang = 'ja-JP';
      u.rate = parseFloat(document.getElementById('rateRange').value);
      u.pitch = parseFloat(document.getElementById('pitchRange').value);
      window.speechSynthesis.speak(u);
    }

    async function startGeneration() {
      const key = document.getElementById('apiKey').value.trim();
      if(!key) return alert("APIキーを入力してください");
      localStorage.setItem('gemini_api_key', key);

      const btn = document.getElementById('generateBtn');
      const resBox = document.getElementById('resultBox');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      btn.textContent = "AI思考中...";
      resBox.style.display = "none";
      status.textContent = "最適なモデルを探しています...";

      try {
        const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        const mData = await mRes.json();
        if(!mRes.ok) throw new Error("API接続失敗");

        // モデルリストを取得し、名前順に並べる
        let models = mData.models
          .filter(m => m.supportedGenerationMethods.includes("generateContent"))
          .sort((a, b) => b.name.localeCompare(a.name));

        // 【ここが高速化ロジック！】前回成功したモデルがあれば、それをリストの最優先（一番上）に持ってくる
        const lastWorkingModel = localStorage.getItem('last_working_model');
        if (lastWorkingModel) {
            models = [ 
                { name: lastWorkingModel }, 
                ...models.filter(m => m.name !== lastWorkingModel) 
            ];
        }

        const prompt = `一発ギャグを作って。必ずJSON形式{"title":"題名","action":"動き","lines":"台詞"}のみで答えて。条件:シチュエーション「${document.getElementById('situation').value}」、お題「${document.getElementById('keyword').value || 'なし'}」`;

        let success = false;
        for (const m of models) {
          status.textContent = `試行中: ${m.name.split('/').pop()}...`;
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${key}`;
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
            });
            const data = await response.json();
            if (response.ok) {
              const text = data.candidates[0].content.parts[0].text;
              const gag = JSON.parse(text.replace(/```json|```/g, "").trim());
              
              currentGagText = gag.lines;
              document.getElementById('gagTitle').textContent = `「 ${gag.title} 」`;
              document.getElementById('gagAction').textContent = `やり方: ${gag.action}`;
              document.getElementById('gagLines').textContent = `『 ${gag.lines} 』`;
              resBox.style.display = "block";
              status.textContent = "成功しました！";

              // 【ここも重要！】成功したモデルの名前を保存する
              localStorage.setItem('last_working_model', m.name);
              
              success = true;
              break;
            }
          } catch (e) { continue; }
        }
        if (!success) alert("現在制限がかかっています。時間を置いてください。");
      } catch (e) { alert("生成に失敗しました。"); }
      finally {
        btn.disabled = false;
        btn.textContent = "ギャグを爆誕させる！";
      }
    }

    function speakGag() {
      if(!currentGagText) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(currentGagText);
      const vName = document.getElementById('voiceSelect').value;
      const v = voices.find(v => v.name === vName);
      if(v) u.voice = v;
      u.lang = 'ja-JP';
      u.rate = parseFloat(document.getElementById('rateRange').value);
      u.pitch = parseFloat(document.getElementById('pitchRange').value);
      window.speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
